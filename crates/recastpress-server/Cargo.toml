[package]
name = "recastpress-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Experimental RecastPress public and management process entrypoints"

[[bin]]
name = "recastpress"
path = "src/main.rs"

[dependencies]
recastpress-core = { path = "../recastpress-core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
