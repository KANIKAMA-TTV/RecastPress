[package]
name = "recastpress-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Experimental editing-side WordPress schema reader for MySQL and MariaDB"

[dependencies]
recastpress-core = { path = "../recastpress-core" }
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki"] }

[dev-dependencies]
recastpress-wp = { path = "../recastpress-wp" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[lints]
workspace = true
