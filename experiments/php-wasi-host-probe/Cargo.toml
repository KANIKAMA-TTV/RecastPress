[package]
name = "recastpress-php-wasi-host-probe"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-2.0-or-later"
publish = false

# Independent P0 experiment; not a production engine or dependency decision.
[workspace]

[dependencies]
wasmtime = { version = "=36.0.19", default-features = false, features = ["std", "runtime", "cranelift", "wat"] }
wasmtime-wasi = "=36.0.19"
wasmtime-wasi-io = "=36.0.19"
sha2 = "=0.10.9"
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.0"
tokio = { version = "1.0", features = ["io-util", "rt-multi-thread", "net", "sync", "time"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
