[package]
name = "recastpress-wasm-request-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-2.0-or-later"
publish = false

[workspace]

[dependencies]
wasmtime = { version = "=36.0.19", default-features = false, features = ["std", "runtime", "cranelift", "wat", "component-model"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "net"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"
