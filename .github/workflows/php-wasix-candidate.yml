name: PHP WASIX Linux host candidates

"on":
  push:
    branches: ["dev/v0.5"]
    paths:
      - "experiments/php-runtime-candidate-probe/**"
      - "experiments/php-wasix-host-probe/**"
      - ".github/workflows/php-wasix-candidate.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: php-wasix-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-probe:
    name: Rust-hosted PHP 8.5.12, Linux ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: target/php-wasix-host-probe
      RUSTUP_TOOLCHAIN: "1.94.0"
    steps:
      - name: Check out the candidate source
        # actions/checkout v4.2.2, verified through the official Git tag ref.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build pkg-config libzstd-dev zlib1g-dev \
            libxml2-dev libncurses-dev libffi-dev

      - name: Install the fixed Rust toolchain
        id: rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustc +1.94.0 --version
          cargo +1.94.0 --version

      - name: Fetch the fixed upstream PHP Actions artifact
        id: php
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .reference/php-wasix-8.5.12
          PHP_ARTIFACT_URL="$(python3 - <<'PY'
          import json
          from urllib.parse import urlsplit
          with open('experiments/php-runtime-candidate-probe/artifact.json', encoding='utf-8') as source:
              identity = json.load(source)
          url = identity['artifact_api_url']
          parsed = urlsplit(url)
          expected = f"/repos/wasix-org/php/actions/artifacts/{identity['artifact_id']}/zip"
          if (parsed.scheme != 'https' or parsed.netloc != 'api.github.com'
                  or parsed.path != expected or parsed.query or parsed.fragment):
              raise SystemExit('Refusing to send the job token to an unexpected artifact endpoint')
          print(url)
          PY
          )"
          # curl drops Authorization on cross-host redirects. Do not add
          # --location-trusted or place GH_TOKEN in a URL or diagnostic output.
          if ! curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --max-time 180 --retry 3 --retry-max-time 300 \
            --max-filesize 10202404 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output .reference/php-wasix-8.5.12/php-wasix-64.zip "$PHP_ARTIFACT_URL"; then
            printf '%s\n' '::error::Upstream PHP artifact download failed. A 403 can mean this repository token cannot read the upstream Actions artifact. No mirror or alternate source was used.'
            exit 1
          fi
          python3 experiments/php-runtime-candidate-probe/prepare_fixture.py

      - name: Fetch locked Rust dependencies
        id: cargo
        run: |
          set -euo pipefail
          cargo +1.94.0 fetch --locked --manifest-path experiments/php-wasix-host-probe/Cargo.toml

      - name: Download and verify the fixed host LLVM
        if: ${{ matrix.backend == 'llvm' }}
        id: llvm
        run: |
          set -euo pipefail
          mkdir -p .reference
          LLVM_URL="$(python3 -c 'import json; print(json.load(open("experiments/php-wasix-host-probe/llvm-toolchain.json"))["archive_url"])')"
          LLVM_ARCHIVE=".reference/llvm-linux-amd64.tar.xz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --max-time 600 --retry 3 --retry-max-time 900 \
            --max-filesize 741670068 --output "$LLVM_ARCHIVE" "$LLVM_URL"
          python3 experiments/php-wasix-host-probe/prepare_host_llvm.py

      - name: Run bounded filesystem, memory, RPC, CGI and WAT metering tests
        id: fixture_fs
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-host-probe/unit_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Execute the independent version-only host probe
        # A test-only Metering failure must not hide the uninstrumented PHP
        # observations. Every failed step still fails the overall job.
        if: ${{ !cancelled() && steps.cargo.outcome == 'success' && steps.php.outcome == 'success' && (matrix.backend == 'cranelift' || steps.llvm.outcome == 'success') }}
        id: probe
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-host-probe/check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Reuse one compiled PHP module across three isolated requests
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        id: reuse
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-host-probe/reuse_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Verify private PHP to Rust RPC, request isolation and incomplete-frame recovery
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        id: rpc
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-host-probe/rpc_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Verify fixed PHP memory ceiling, OOM, recovery and uncapped control
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        id: php_memory
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-host-probe/memory_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Compare three fixed PHP language cases with the native reference
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        id: language
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-host-probe/language_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Record declared licenses for the fixed Linux dependency graph
        if: ${{ !cancelled() && steps.cargo.outcome == 'success' }}
        id: license_inventory
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-host-probe/license_inventory.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Record CI stage outcomes
        if: ${{ always() }}
        env:
          STAGE_DEPENDENCIES: ${{ steps.dependencies.outcome }}
          STAGE_RUST: ${{ steps.rust.outcome }}
          STAGE_CARGO: ${{ steps.cargo.outcome }}
          STAGE_LLVM: ${{ steps.llvm.outcome }}
          STAGE_PHP: ${{ steps.php.outcome }}
          STAGE_PROBE: ${{ steps.probe.outcome }}
          STAGE_LANGUAGE: ${{ steps.language.outcome }}
          STAGE_FIXTURE_FS: ${{ steps.fixture_fs.outcome }}
          STAGE_REUSE: ${{ steps.reuse.outcome }}
          STAGE_RPC: ${{ steps.rpc.outcome }}
          STAGE_PHP_MEMORY: ${{ steps.php_memory.outcome }}
          STAGE_LICENSE_INVENTORY: ${{ steps.license_inventory.outcome }}
          PROBE_BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path.cwd()
          evidence = root / 'experiments/php-wasix-host-probe/evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          inputs = ['.github/workflows/php-wasix-candidate.yml',
                    'experiments/php-wasix-host-probe/llvm-toolchain.json',
                    'experiments/php-runtime-candidate-probe/artifact.json']
          report = {
              'format_version': 1,
              'scope': 'independent Linux host version, module reuse, private RPC, fixed PHP memory and language P0 candidate',
              'backend': os.environ['PROBE_BACKEND'],
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'stages': {name.lower(): os.environ.get('STAGE_' + name, '') or 'not_run'
                         for name in ['DEPENDENCIES', 'RUST', 'PHP', 'CARGO', 'LLVM', 'FIXTURE_FS', 'PROBE', 'REUSE', 'RPC', 'PHP_MEMORY', 'LANGUAGE', 'LICENSE_INVENTORY']},
              'input_files': {name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                              for name in inputs if (root / name).is_file()},
              'wordpress_bootstrapped': False,
              'product_runtime_selected': False,
          }
          (evidence / 'ci-stages.json').write_text(json.dumps(report, indent=2) + '\n',
                                                encoding='utf-8', newline='\n')
          PY

      - name: Upload evidence only
        if: ${{ always() }}
        # actions/upload-artifact v4.6.2, verified through its official Git ref.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: php-wasix-linux-${{ matrix.backend }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          # Historical source-bound receipts already live in Git. Upload only
          # top-level observations for this job, without nesting past runs.
          path: experiments/php-wasix-host-probe/evidence/*.json
          if-no-files-found: warn
          retention-days: 14
