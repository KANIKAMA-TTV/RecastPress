name: PHP WASIX managed access candidate

"on":
  push:
    branches: ["dev/v0.5"]
    # All compile inputs plus fixed profile drivers; JSON imports and prose stay out.
    paths:
      - "experiments/php-wasix-managed-access-probe/fixtures/recastpress_fs_access.h"
      - "experiments/php-wasix-managed-access-probe/patches/0001-wasi-managed-access.patch"
      - "experiments/php-wasix-host-probe/Cargo.*"
      - "experiments/php-wasix-host-probe/src/**"
      - "experiments/php-wasix-host-probe/fixtures/**"
      - "experiments/php-runtime-candidate-probe/fixtures/runtime_contract.php"
      - "experiments/php-wasix-cgi-build/manifest.json"
      - "experiments/php-wasix-context-probe/manifest.json"
      - "experiments/php-wasix-context-probe/fixtures/context_contract.c"
      - "experiments/php-wasix-context-probe/fixtures/stack_adapter.c"
      - "experiments/php-wasix-context-probe/fixtures/stack_adapter.h"
      - "experiments/php-wasix-context-probe/fixtures/stack_adapter.S"
      - "experiments/php-wasix-fiber-probe/manifest.json"
      - "experiments/php-wasix-fiber-probe/patches/0001-nts-fresh-wasi-zend-fibers.patch"
      - "experiments/php-wasix-fiber-probe/fixtures/zend_wasix_fiber.S"
      - "experiments/php-wasix-fiber-probe/fixtures/fiber_contract.php"
      - "experiments/php-wasix-fiber-probe/evidence/native-fiber-contract.json"
      - "experiments/php-wasix-cgi-build/patches/0001-wasi-disable-cgi-prefork.patch"
      - "experiments/php-wasix-fiber-cgi-probe/manifest.json"
      - "experiments/php-wasix-fiber-cgi-probe/fixtures/fiber_cgi_contract.php"
      - "experiments/php-wasix-fiber-cgi-probe/evidence/native-cgi-fiber-contract.json"
      - "experiments/php-wasix-cgi-runtime-probe/manifest.json"
      - "experiments/php-wasix-cgi-runtime-probe/fixtures/runtime_cgi_contract.php"
      - "experiments/php-wasix-cgi-runtime-probe/evidence/native-cgi-runtime-contract.json"
      - "experiments/php-wasi-host-probe/wordpress-fixture.json"
      - "experiments/php-wasi-host-probe/src/cgi_response.rs"
      - "experiments/php-wasix-host-probe/check.py"
      - "experiments/php-wasix-host-probe/cgi_check.py"
      - "experiments/php-wasix-host-probe/native_cgi_contract.py"
      - "experiments/php-wasix-host-probe/evidence/native-cgi-contract.json"
      - "experiments/php-wasix-cgi-build/build.py"
      - "experiments/php-wasix-cgi-build/patch_source.py"
      - "experiments/php-wasix-host-probe/language_check.py"
      - "scripts/owned_probe.py"
      - "experiments/php-wasix-fiber-cgi-probe/build.py"
      - "experiments/php-wasix-fiber-cgi-probe/patch_source.py"
      - "experiments/php-wasix-fiber-cgi-probe/fiber_cgi_check.py"
      - "experiments/php-wasix-fiber-cgi-probe/native_contract.py"
      - "experiments/php-wasix-cgi-runtime-probe/prepare.py"
      - "experiments/php-wasix-cgi-runtime-probe/runtime_check.py"
      - "experiments/php-wasix-cgi-runtime-probe/native_contract.py"
      - "experiments/php-wasix-fiber-probe/build.py"
      - "experiments/php-wasix-fiber-probe/patch_source.py"
      - "experiments/php-wasix-fiber-probe/native_contract.py"
      - "experiments/php-wasix-cgi-build/prepare.py"
      - "scripts/wordpress_reference.py"
      - "experiments/php-runtime-candidate-probe/native_contract.py"
      - "experiments/php-runtime-candidate-probe/evidence/native-contract.json"
      - "experiments/php-wasix-host-probe/unit_check.py"
      - "experiments/php-wasix-host-probe/prepare_host_llvm.py"
      - "experiments/php-wasix-host-probe/llvm-toolchain.json"
      - "experiments/php-wasix-managed-access-probe/build.py"
      - "experiments/php-wasix-managed-access-probe/source_profile.py"
      - "experiments/php-wasix-managed-access-probe/patch_source.py"
      - "experiments/php-wasix-managed-access-probe/managed_check.py"
      - "experiments/php-wasix-managed-access-probe/cgi_check.py"
      - "experiments/php-wasix-managed-access-probe/manifest.json"
      - "experiments/php-wasix-managed-access-probe/patch-plan.json"
      - "experiments/php-wasix-managed-access-probe/patches/*.patch"
      - "experiments/php-wasix-managed-access-probe/fixtures/*.h"
      - ".github/workflows/php-wasix-managed-access.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: php-wasix-managed-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run:
    name: Managed PHP access and Rust host, Linux ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.94.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out experiment definitions
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out the fixed official PHP source
        id: php_source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wasix-org/php
          ref: f4bfae79d5c19028349082f707930cf0951d23b9
          path: target/php-wasix-managed-access-probe/source/php
          persist-credentials: false

      - name: Check out the fixed prebuilt WASIX dependency source
        id: deps_source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wasix-org/php-wasix-deps
          ref: b77ecbede97aba2df32c86eaeb54ff9f5e44f543
          path: target/php-wasix-managed-access-probe/source/php-wasix-deps
          persist-credentials: false

      - name: Preseed the fixed stub parser without its automatic archive download
        id: parser_source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nikic/PHP-Parser
          ref: f103601b29efebd7ff4a1ca7b3eeea9e3336a2a2
          path: target/php-wasix-managed-access-probe/source/php/build/PHP-Parser-5.6.1
          persist-credentials: false

      - name: Install native build tools and stub-generation PHP
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential autoconf automake bison re2c pkg-config wabt \
            curl xz-utils tar php-cli php-xml \
            cmake ninja-build libzstd-dev zlib1g-dev libxml2-dev libncurses-dev libffi-dev

      - name: Validate closed build inputs
        id: definitions
        run: |
          set -euo pipefail
          python3 experiments/php-wasix-cgi-build/prepare.py --validate-only
          python3 experiments/php-wasix-managed-access-probe/build.py --validate-only
          python3 experiments/php-wasix-cgi-runtime-probe/prepare.py --validate-only

      - name: Download, verify and manually place the four fixed host tools
        id: tools
        run: python3 experiments/php-wasix-cgi-build/prepare.py --record

      - name: Build the three-patch managed access candidate without guest execution
        id: build
        run: python3 experiments/php-wasix-managed-access-probe/build.py --record

      - name: Prepare the fixed native Rust host
        id: rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustc +1.94.0 --version
          cargo +1.94.0 fetch --locked --manifest-path experiments/php-wasix-host-probe/Cargo.toml

      - name: Prepare the separately pinned host LLVM 22.1
        if: ${{ matrix.backend == 'llvm' }}
        id: host_llvm
        run: |
          set -euo pipefail
          mkdir -p .reference
          LLVM_URL="$(python3 -c 'import json; print(json.load(open("experiments/php-wasix-host-probe/llvm-toolchain.json"))["archive_url"])')"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --max-time 600 --retry 3 --retry-max-time 900 \
            --max-filesize 741670068 --output .reference/llvm-linux-amd64.tar.xz "$LLVM_URL"
          python3 experiments/php-wasix-host-probe/prepare_host_llvm.py

      - name: Verify closed assembly parser and bounded host units
        id: units
        run: python3 experiments/php-wasix-host-probe/unit_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Compare six native CGI Fiber cases in three fresh Rust-hosted requests
        id: fiber_contract
        run: python3 experiments/php-wasix-managed-access-probe/managed_check.py --fiber ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Verify and place only three fixed pure WordPress hook sources
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.units.outcome == 'success' }}
        id: wordpress_source
        run: |
          set -euo pipefail
          mkdir -p .reference
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --max-time 300 --retry 2 --retry-max-time 600 \
            --max-filesize 35368461 --output .reference/wordpress-7.1.3.tar.gz \
            https://wordpress.org/wordpress-7.1.3.tar.gz
          python3 experiments/php-wasix-cgi-runtime-probe/prepare.py --record

      - name: Compare fixed GET, POST, status, cookies and binary response with native
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.units.outcome == 'success' }}
        id: cgi_contract
        run: python3 experiments/php-wasix-managed-access-probe/cgi_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Compare fixed CGI language, pure hooks and actual IO with native
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.units.outcome == 'success' && steps.wordpress_source.outcome == 'success' }}
        id: runtime_contract
        run: python3 experiments/php-wasix-managed-access-probe/managed_check.py ${{ matrix.backend == 'llvm' && '--llvm' || '' }} --record

      - name: Record CI outcomes even if preparation or build failed
        if: ${{ always() }}
        env:
          STAGE_PHP_SOURCE: ${{ steps.php_source.outcome }}
          STAGE_DEPS_SOURCE: ${{ steps.deps_source.outcome }}
          STAGE_PARSER_SOURCE: ${{ steps.parser_source.outcome }}
          STAGE_DEPENDENCIES: ${{ steps.dependencies.outcome }}
          STAGE_DEFINITIONS: ${{ steps.definitions.outcome }}
          STAGE_TOOLS: ${{ steps.tools.outcome }}
          STAGE_BUILD: ${{ steps.build.outcome }}
          STAGE_RUST: ${{ steps.rust.outcome }}
          STAGE_HOST_LLVM: ${{ steps.host_llvm.outcome }}
          STAGE_UNITS: ${{ steps.units.outcome }}
          STAGE_WORDPRESS_SOURCE: ${{ steps.wordpress_source.outcome }}
          STAGE_RUNTIME_CONTRACT: ${{ steps.runtime_contract.outcome }}
          STAGE_FIBER_CONTRACT: ${{ steps.fiber_contract.outcome }}
          STAGE_CGI_CONTRACT: ${{ steps.cgi_contract.outcome }}
          PROBE_BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path.cwd()
          experiment = root / 'experiments/php-wasix-managed-access-probe'
          evidence = experiment / 'evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          inputs = [root / '.github/workflows/php-wasix-managed-access.yml']
          inputs += sorted(experiment.glob('*.py')) + sorted(experiment.glob('*.json'))
          inputs += sorted(experiment.glob('patches/*.patch')) + sorted(experiment.glob('fixtures/*'))
          inputs += [root / 'experiments/php-wasix-fiber-cgi-probe/evidence/native-cgi-fiber-contract.json']
          inputs += [root / 'experiments/php-wasix-host-probe/evidence/native-cgi-contract.json',
                     root / 'experiments/php-wasix-host-probe/cgi_check.py',
                     root / 'experiments/php-wasix-host-probe/native_cgi_contract.py']
          inputs += [root / 'experiments/php-wasix-host-probe/llvm-toolchain.json',
                     root / 'experiments/php-wasix-host-probe/prepare_host_llvm.py',
                     root / 'experiments/php-wasix-host-probe/unit_check.py']
          runtime = root / 'experiments/php-wasix-cgi-runtime-probe'
          inputs += sorted(runtime.glob('*.py')) + sorted(runtime.glob('*.json'))
          inputs += sorted(runtime.glob('fixtures/*')) + [runtime / 'evidence/native-cgi-runtime-contract.json']
          report = {
              'format_version': 1,
              'scope': 'Three-patch NTS CGI build with pure Rust access queries, native Fiber and runtime comparisons; no product adoption',
              'backend': os.environ['PROBE_BACKEND'],
              'guest_execution_verdict': 'see the separate Fiber, CGI and runtime comparison receipts',
              'product_runtime_selected': False,
              'redistributed_binaries': False,
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'stages': {name.lower(): os.environ.get('STAGE_' + name, '') or 'not_run'
                         for name in ['PHP_SOURCE', 'DEPS_SOURCE', 'PARSER_SOURCE',
                                      'DEPENDENCIES', 'DEFINITIONS', 'TOOLS', 'BUILD',
                                      'RUST', 'HOST_LLVM', 'UNITS', 'WORDPRESS_SOURCE', 'FIBER_CONTRACT', 'CGI_CONTRACT', 'RUNTIME_CONTRACT']},
              'input_files': {path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                              for path in inputs if path.is_file()},
          }
          (evidence / 'ci-stages.json').write_text(json.dumps(report, indent=2) + '\n',
                                                encoding='utf-8', newline='\n')
          PY

      - name: Upload JSON evidence only
        if: ${{ always() }}
        # actions/upload-artifact v4.6.2; no source, toolchain or Wasm binaries.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: php-wasix-managed-access-${{ matrix.backend }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/php-wasix-managed-access-probe/evidence/*.json
            experiments/php-wasix-fiber-cgi-probe/evidence/native-cgi-fiber-contract.json
            experiments/php-wasix-host-probe/evidence/native-cgi-contract.json
            experiments/php-wasix-cgi-runtime-probe/evidence/native-cgi-runtime-contract.json
            experiments/php-wasix-cgi-runtime-probe/evidence/wordpress-source.json
            experiments/php-wasix-cgi-build/evidence/toolchain.json
            experiments/php-wasix-host-probe/evidence/*unit-contract.json
            experiments/php-wasix-host-probe/evidence/llvm-toolchain-verification.json
          if-no-files-found: warn
          retention-days: 14
