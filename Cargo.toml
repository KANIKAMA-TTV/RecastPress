[workspace]
members = ["crates/recastpress-core", "crates/recastpress-server", "crates/recastpress-wp", "crates/recastpress-db"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

